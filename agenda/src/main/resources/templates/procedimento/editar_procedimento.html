<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/img/Favicon.svg">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">

    <title>Tally - A clareza que o seu crescimento exige.</title>
</head>
<body>
<!-- Cabeçalho -->
<header>
    <div class="header__content">
        <div class="logomarca">
            <img src="/img/Logomarca.png" alt="Logomarca Tally">
        </div>
        <div class="icons__content">
            <a href="https://mail.google.com/mail/u/0/?tab=rm&ogbl" target="_blank" class="header-icon"><img src="/img/Email.svg" alt="Botão de Email"></a>
            <a href="https://web.whatsapp.com/" target="_blank" class="header-icon"><img src="/img/Whatsapp.svg" alt="Botão para Whatsapp"></a>
        </div>
    </div>
</header>
<!-- Menu Lateral -->
<section class="sidenav">
    <div class="sidenav__content">
        <div class="menu">
            <a href="/" class="category__menu"><img src="/img/Agendamento.svg" alt="Ícone Agenda"><span>Agenda</span></a>
            <a href="/criaragendamento.html" class="category__menu"><img src="/img/CriarAgendamento.svg" alt="Ícone Criar Agendamento"><span>Criar Agendamento</span></a>
            <a href="/cliente/criar" class="category__menu"><img src="/img/CadastroCliente.svg" alt="Ícone Cadastro de Cliente"><span>Cadastro de Cliente</span></a>
            <a href="/procedimento/criar" class="category__menu"><img src="/img/CadastrodeServiços.svg" alt="Ícone Cadastro de Serviços"><span>Cadastro de Serviços</span></a>
        </div>
        <div class="settings">
            <div class="item__settings"><div class="user-dot" id="userColor"></div><span id="Name">Nome</span></div> <!-- A classe user-dot vai permitir troca de cor / ID Name = Nome do Usuário -->
            <a href="" class="item__settings configuration"><img src="img/Settings.svg"><span>Settings</span></a>
        </div>
    </div>
</section>
<!-- Conteúdo da Página -->
<section class="main">
    <div class="formulario__container">
        <div class="formulario__title-box">
            <span>Novo Serviço:</span>
        </div>

        <form class="formulario__body" th:action="@{/procedimento/editar}" method="post" th:object="${editarProcedimentoRequest}">

            <input type="hidden" th:field="*{id}" />
            <div class="input-group">
                <label for="nome_procedimento">Nome do Serviço:</label>
                <input type="text" id="nome_procedimento" name="procedimento" th:field="*{nome}">
            </div>

            <div class="input-group">
                <label for="valor">Valor:</label>
                <input type="text" id="valor" name="valor" th:field="*{valor}">
            </div>

            <div class="formulario__actions">
                <div class="btn-group">
                    <button onclick="history.back()"  type="button" class="btn btn-cancelar-cadastro">Cancelar</button>
                    <button type="submit" class="btn btn-cadastrar-cliente">Cadastrar Serviço</button>
                </div>
                <button type="button" class="link-ver-clientes" onclick="openModal()">Ver Todos os Serviços ></button>
            </div>
        </form>
        <div th:if="${erro}">
            <p th:text="${erro}"></p>
        </div>
    </div>
</section>
<script>
    const inputValor = document.getElementById("valor");

inputValor.addEventListener("input", function (e) {
    let valor = e.target.value.replace(/\D/g, "");

    if (valor === "") {
        e.target.value = "";
        return;
    }

    valor = (parseInt(valor, 10) / 100).toFixed(2);

    valor = valor.replace(".", ",");

    e.target.value = "R$ " + valor;
});
</script>
</body>
</html>
